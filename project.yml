name: HimLab2
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  HimLab2:
    type: application
    platform: iOS
    sources:
      - path: .               # Искать файлы во всей текущей папке
        excludes:
          - "project.yml"
          - ".github"
          - "*.md"
          - "*Tests*"         # На всякий случай исключаем любые папки с тестами
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.himlab2
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
